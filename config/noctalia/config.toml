[shell]
polkit_agent = true

[shell.greeter_sync]
auto_sync = true

[lockscreen]
lock_before_suspend = false

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"
enabled = true

[widget.workspaces]
hide_when_empty = true

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["umbriel"]
